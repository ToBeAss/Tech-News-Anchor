# Tech Brief — iteration 1 (manual, terminal output)
#
# Sources are plain RSS. YouTube channels are RSS too — no API key needed:
#   https://www.youtube.com/feeds/videos.xml?channel_id=<CHANNEL_ID>
# TLDR has no official feed; it arrives by email. Deferred to iteration 2
# (Gmail API pull), since the community RSS mirrors are unreliable.
#
# Per-source keys:
#   kind:       article | video | paper  (labelling only)
#   aggregator: true  -> display as "domain via Feed Name" (HN, lobste.rs)
#   per_feed:       override the global cap for this source
#   preserve_order: keep feed order (ranked feeds); skip the date re-sort
#   match:      keyword allowlist applied BEFORE the cap; for firehose feeds
#   gate:       free-text relevance rule, judged by a small LLM call at ingestion.
#               For sources where the topic is not reliably in the title.
#   exclude:    keyword blocklist, applied first; e.g. paywall markers

llm:
  # Default for any stage without an override below.
  model: "gpt-5.4"
  temperature: 0.7
  max_output_tokens: 2000

  # Per-stage models. Different jobs need different capability:
  #   synthesis — ranking, relevance judgement, and writing. This is where the
  #               capable model earns its cost; mini produced visibly flatter
  #               commentary and missed cross-domain relevance.
  #   dedupe    — grouping same-event items. Mostly matching, BUT it has to spot
  #               that two headlines sharing no words and written in different
  #               languages are one story. Verify before trusting mini here.
  #   gate      — binary on-topic classification from title + description. The
  #               easiest job in the pipeline; mini is ample.
  stages:
    synthesis: "gpt-5.4"
    dedupe: "gpt-5.4"
    gate: "gpt-5.4-mini"

# Items already briefed are remembered in state/seen.json and excluded from
# later runs, so a wide window does not resurface the same stories daily.
# `--no-memory` ignores it for a run, `--forget` clears it, and
# `--why <url>` prints what a briefed item said at the time.
# Retention is fixed at 30 days in brief/memory.py — well past any window.

window:
  # Deliberately wider than the daily publishing cadence. With memory on, the
  # window is not "what gets published" — it is "what is eligible". Memory
  # handles freshness; the window handles reach. Overlap buys three things:
  #   - a failed run is recovered by the next one instead of losing a day
  #   - a story crowded out on a busy day gets another chance on a quiet one
  #     (memory only blocks items that were actually briefed)
  #   - late-arriving and backfilled feed items are not dropped at the boundary
  # Items carry their age into the prompt, so older ones must earn their slot.
  hours: 48
  per_feed: 12

# Who the brief is for. This is context for JUDGEMENT, not a topic filter —
# it lets the model reason about second-order relevance (a standards change or
# a foreign procurement precedent can matter without naming your sector).
# EDIT THIS: the details below are a starting draft, not verified facts about
# your team. The more specific and honest it is, the better the ranking.
#
# When delivery splits into Discord (personal) and Teams (work), this block is
# the natural thing to fork — same pipeline, two audience descriptions.
#
# No organisation is named below, on purpose: a named employer became a hook
# the model reached for directly ("Kartverket-adjacent teams should watch
# this") instead of using it as background judgement, which the prompt
# explicitly forbids. Keep it this way — describe the reasoning the reader
# needs, not the org that needs it.
audience: |
  A small innovation team inside a national public-sector agency responsible
  for large-scale geospatial infrastructure — mapping, the cadastre, the land
  register, sea charts and geodesy. The team explores emerging technology to
  build a working understanding of it — hands-on, not a survey — so its
  interest is practical and forward-looking rather than academic.

  What this means for relevance:
  - Public-sector constraints are real: procurement rules, data protection,
    long service lifetimes, accessibility and archiving requirements, and an
    obligation to justify technology choices publicly.
  - Sovereignty and dependency matter more than for a private company. Where
    data and compute physically sit, and how hard a vendor is to leave, are
    first-order questions, not footnotes.
  - Geospatial and location data are the domain: standards, formats, open
    data policy, and how AI systems consume and misuse spatial data.
  - EU and Norwegian regulation lands on this team directly — the AI Act,
    Data Act, INSPIRE, and national digitalisation policy.
  - Other public bodies' experiences (in Norway, the Nordics, or the wider EU)
    are directly transferable evidence. Treat them as such.
  - The reader is technical: a developer who builds, not only evaluates.
    Concrete engineering detail is welcome and does not need simplifying.

interests: |
  Agentic AI systems, LLM tooling and orchestration, memory/context
  architectures. Backend and systems engineering (Python, cloud-native,
  containers, GCP). Developer tooling and infrastructure. Geospatial tech and
  public-sector digitalisation. AI regulation and governance in the EU.
  Leadership and institutional changes at frontier AI labs, when they signal a
  shift in research direction or capability rather than ordinary executive
  churn.
  Not interested in: consumer gadget launches, crypto price moves, funding
  rounds without a technical angle.

# Ranking weight applied on top of `interests`. Kept separate because it is a
# weighting rule, not a topic — burying it in the interests paragraph got it
# treated as a footnote and Norwegian stories were consistently dropped.
priorities: |
  Norwegian and Nordic tech, public-sector digitalisation, and local
  infrastructure stories rank ABOVE their international equivalents. If a
  global story has a Norwegian instance in the candidates, lead with the
  Norwegian one. Norwegian-language sources are first-class, not filler.
  Datacentre siting, national digital infrastructure, public-sector security
  incidents, and Norwegian regulatory moves are high priority even when the
  item is short or the summary is untranslated.

sources:
  - name: "Fireship"
    kind: "video"
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCsBjURrPoezykLs9EqgamOA"

  # Mostly off-topic, occasionally excellent on self-hosting, local LLMs and
  # Linux. Titles rarely reveal which — hence the gate rather than `match`.
  - name: "PewDiePie"
    kind: "video"
    per_feed: 5
    url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC-lHJZR3Gqxm24_Vd_AJ5Yw"
    gate: |
      KEEP videos about programming, software development, self-hosting, home
      servers, Linux, running local AI models, hardware builds, or hands-on
      experiments with technology — including when framed as a personal
      challenge or hobby project rather than a tutorial.
      DROP gaming and let's-plays, reactions, vlogs, family and lifestyle
      content, commentary on internet drama, and anything where technology is
      only incidental background.

  # --- Discovery layer -------------------------------------------------------
  # Threshold lowered to 100: filtering is cheap, so over-ingest and let the
  # model cut. Aggregators display the origin domain, not their own name.
  - name: "Hacker News"
    kind: "article"
    aggregator: true
    preserve_order: true   # hnrss returns point-ranked; do not re-sort by date
    per_feed: 12
    url: "https://hnrss.org/frontpage?points=100"

  - name: "lobste.rs"
    kind: "article"
    aggregator: true
    preserve_order: true   # lobste.rs returns hotness-ranked
    per_feed: 8
    url: "https://lobste.rs/rss"

  # --- Practitioners and press ----------------------------------------------
  - name: "Simon Willison"
    kind: "article"
    per_feed: 6
    url: "https://simonwillison.net/atom/everything/"

  # Capped at 4: high publishing rate, otherwise dominates on volume alone.
  - name: "The Register"
    kind: "article"
    per_feed: 6
    url: "https://www.theregister.com/headlines.atom"

  # NOTE: the old /arstechnica/technology-lab path is a dead legacy section —
  # that is why it silently returned zero. This is the live index feed.
  # Narrower alternatives: arstechnica.com/ai/feed, .../information-technology/feed
  - name: "Ars Technica"
    kind: "article"
    per_feed: 6
    url: "https://feeds.arstechnica.com/arstechnica/index"

  # --- Research --------------------------------------------------------------
  # cs.AI announces ~150 papers/day in submission order, so "newest 3" is close
  # to random sampling. The keyword gate runs before the cap and is what makes
  # this source usable — tune these terms, they are the whole filter.
  - name: "arXiv cs.AI"
    kind: "paper"
    per_feed: 3
    url: "https://rss.arxiv.org/rss/cs.AI"
    match:
      - "agent"
      - "tool use"
      - "retrieval"
      - "memory"
      - "orchestrat"
      - "context window"
      - "evaluation"

  # --- Norwegian / public sector --------------------------------------------
  # UNVERIFIED URLs — I could not reach these to confirm. Run --dry and check
  # for a "returned 0 entries" warning; if so, view-source the site and search
  # for 'rss' or 'atom' to find the real path.
  # [Ekstra] marks paywalled articles — excluded, since a link a colleague
  # can't open is worse than no link. Drop the exclude to see them anyway.
  - name: "digi.no"
    kind: "article"
    per_feed: 6
    url: "https://www.digi.no/rss"
    exclude:
      - "[ekstra]"

  - name: "kode24"
    kind: "article"
    per_feed: 5
    url: "https://www.kode24.no/?lab_viewport=rss"